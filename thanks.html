<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thank you - Quinn's Card</title>
<style>:root{--bg:#0d1020;--card:#171c36;--teal:#3fd6c1;--amber:#ffbf47;--fg:#e8ecff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:16px max(16px,env(safe-area-inset-left))}
main{max-width:620px;margin:0 auto}a{color:var(--teal)}.btn{display:inline-block;background:var(--amber);color:#1a1300;font-weight:700;border-radius:8px;padding:12px 18px;text-decoration:none}.box{background:var(--card);border:2px solid var(--teal);border-radius:12px;padding:14px 18px;margin:14px 0}</style></head>
<body><main><h1>Thank you!</h1><div class="box" id="out">Checking your payment...</div><p><a href="shop.html">Back to the card shop</a></p></main>
<script src="cards.js?v=20261122c"></script><script>
var s = (location.search.match(/[?&]s=(cs_[A-Za-z0-9_]+)/) || [])[1], out = document.getElementById('out');
if (!API || !s) out.textContent = 'This page is for buyers who just paid. Open it from the checkout.';
else fetch(API + '/api/claim?s=' + s).then(function (r) { return r.json(); }).then(function (d) {
  if (!d.ok) { out.textContent = d.error === 'not paid' ? 'The payment is not confirmed yet. Wait a moment and reload this page.' : 'Something went wrong with this card (' + d.error + '). Please contact the studio on stream.'; return; }
  out.innerHTML = '<b>' + d.serial + ' ' + d.title.replace(/[<>&]/g, '') + '</b> is yours, ' + d.owner + '.<p><a class="btn" href="' + d.file + '">Download your card</a></p><p>Keep the file: it has the serial number inside. Your card page: <a href="card.html?c=' + d.serial + '">' + d.serial + '</a></p>'; })
  .catch(function () { out.textContent = 'Could not reach the shop. Reload this page in a minute; your payment is safe.'; });
</script></body></html>
