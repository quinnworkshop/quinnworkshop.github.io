<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Download your card - Quinn's Card</title>
<style>:root{--bg:#0d1020;--card:#171c36;--teal:#3fd6c1;--amber:#ffbf47;--fg:#e8ecff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:16px max(16px,env(safe-area-inset-left))}
main{max-width:620px;margin:0 auto}a{color:var(--teal)}.btn{display:inline-block;background:var(--amber);color:#1a1300;font-weight:700;border:0;border-radius:8px;padding:12px 18px;text-decoration:none;font:inherit;cursor:pointer}.box{background:var(--card);border:2px solid var(--teal);border-radius:12px;padding:14px 18px;margin:14px 0}input{width:100%;font:inherit;padding:10px;border-radius:8px;border:2px solid #2b3366;background:#0a0d1c;color:var(--fg);margin:8px 0}</style></head>
<body><main><h1>Download your card</h1><div class="box"><p>Paste the licence key from your receipt (Gumroad shows it after you pay).</p><input id="k" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX" autocomplete="off"><button class="btn" id="go" type="button">Get my card</button></div><div class="box" id="out" hidden></div><p><a href="shop.html">Back to the card shop</a></p></main>
<script src="cards.js?v=20261122b"></script><script>
var out = document.getElementById('out');
function claim(qs) { out.hidden = false; out.textContent = 'Checking...';
  if (!API) { out.textContent = 'The shop is not connected yet.'; return; }
  fetch(API + '/api/claim?' + qs).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) { out.textContent = 'We could not find that purchase. Check the key, or ask the studio on stream.'; return; }
    out.innerHTML = '<b>' + d.serial + ' ' + d.title.replace(/[<>&]/g, '') + '</b> is yours, ' + d.owner.replace(/[<>&]/g, '') + '.<p><a class="btn" href="' + d.file + '">Download your card</a></p>' + (d.bundle ? '<p>Your framed print is on its way.</p>' : '') + '<p>Keep the file: it has the serial number inside. Your card page: <a href="card.html?c=' + d.serial + '">' + d.serial + '</a></p>'; }).catch(function () { out.textContent = 'Could not reach the shop. Try again in a minute; your purchase is safe.'; }); }
document.getElementById('go').onclick = function () { var k = document.getElementById('k').value.trim(); if (k) claim('key=' + encodeURIComponent(k)); };
var q = (location.search.match(/[?&]sale_id=([^&]+)/) || [])[1]; if (q) claim('sale=' + q);
</script></body></html>
