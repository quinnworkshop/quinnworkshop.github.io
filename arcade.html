<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quinn's Arcade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080c18;color:#eef3ff;font:700 16px system-ui,sans-serif;overflow:hidden}#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}#frame{position:relative;width:min(90vw,calc(90vh * 214 / 180));aspect-ratio:214/180;background:#0b1326;border:10px solid #26355c;border-radius:14px;box-shadow:0 0 0 4px #10182c,0 12px 34px #000}#c{display:block;width:100%;height:100%;image-rendering:pixelated;background:#0b1326}#pad{display:flex;align-items:center;justify-content:center;gap:28px;height:90px}#arrows{display:grid;grid-template-columns:repeat(3,30px);grid-template-rows:repeat(3,30px);gap:2px}#arrows button{grid-column:2}#arrows button:nth-child(2){grid-column:1;grid-row:2}#arrows button:nth-child(3){grid-column:3;grid-row:2}button{font:700 14px system-ui,sans-serif;color:#eef3ff;background:#26355c;border:2px solid #4d6aad;border-radius:8px;padding:8px 12px;cursor:pointer;touch-action:none}button:active{background:#4d6aad;transform:translateY(1px)}#actions{display:grid;grid-template-columns:repeat(3,52px);gap:8px}#actions button{padding:8px 0}#menuBtn{position:absolute;right:-4px;top:-48px;padding:5px 10px;font-size:12px}#menu{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(8,12,24,.88)}#menu.on{display:flex}#menu h2{margin:0 0 8px;font-size:20px;letter-spacing:1px;color:#ffb84d}#hint{font:500 12px system-ui,sans-serif;color:#9bb0d8}
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <canvas id="c" width="642" height="540"></canvas>
    <button id="menuBtn">MENU</button>
    <div id="menu">
      <h2>QUINN'S ARCADE</h2>
      <button id="resume">RESUME</button>
      <button id="again">START AGAIN</button>
      <button id="back">BACK TO QUINN'S ROOM</button>
    </div>
  </div>
  <div id="pad">
    <div id="arrows">
      <button data-key="up">^</button><button data-key="left">&lt;</button><button data-key="right">&gt;</button><button data-key="down">v</button>
    </div>
    <div id="actions">
      <button data-key="y">Y</button><button data-key="x">X</button><button data-key="b">B</button><button data-key="a">A</button><button data-key="select">SEL</button><button data-key="start">STA</button>
    </div>
  </div>
  <div id="hint">ARROWS TO MOVE - Z/X/A/S FOR Y/X/B/A - ENTER START - SHIFT SELECT - ESC MENU</div>
</div>
<script src="js/games.js"></script>
<script>
(function () {
  var menu = document.getElementById('menu');
  function show(on) { menu.classList.toggle('on', on); }
  function key(n, d) { if (window.ARCADE && ARCADE.press) ARCADE.press(n, d); }
  function button(n) { if (window.ARCADE && ARCADE[n]) ARCADE[n](); }
  document.getElementById('resume').onclick = function () { show(false); };
  document.getElementById('again').onclick = function () { var g = ARCADE.current; if (g) ARCADE.start(g.id); show(false); };
  document.getElementById('back').onclick = function () { parent.postMessage({ type: 'arcade-back' }, '*'); };
  document.getElementById('menuBtn').onclick = function () { show(true); };
  document.querySelectorAll('[data-key]').forEach(function (b) {
    var n = b.dataset.key;
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); b.setPointerCapture(e.pointerId); if (n === 'start' || n === 'select') button('press' + n.charAt(0).toUpperCase() + n.slice(1)); else key(n, true); });
    b.addEventListener('pointerup', function () { if (n !== 'start' && n !== 'select') key(n, false); });
    b.addEventListener('pointercancel', function () { if (n !== 'start' && n !== 'select') key(n, false); });
  });
  var keys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', z: 'a', Z: 'a', x: 'b', X: 'b', a: 'y', A: 'y', s: 'x', S: 'x', Enter: 'start', Shift: 'select' };
  addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { show(!menu.classList.contains('on')); return; }
    var n = keys[e.key]; if (!n) return;
    e.preventDefault();
    if (n === 'start' || n === 'select') button('press' + n.charAt(0).toUpperCase() + n.slice(1)); else key(n, true);
  });
  addEventListener('keyup', function (e) {
    var n = keys[e.key]; if (!n || n === 'start' || n === 'select') return;
    e.preventDefault(); key(n, false);
  });
  setInterval(function () { if (window.ARCADE) { ARCADE.tick(); ARCADE.draw(); } }, 1000 / 60);
})();
</script>
</body>
</html>
